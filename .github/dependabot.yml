version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Group all minor/patch updates into a single PR
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Rebase PRs automatically when they have conflicts
    rebase-strategy: auto

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
    rebase-strategy: auto
